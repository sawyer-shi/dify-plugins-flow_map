identity:
  name: ai_flow_map
  author: sawyer-shi
  label:
    en_US: AI Flowchart
    zh_Hans: AI流程图
description:
  human:
    en_US: Use a selected LLM model to summarize plain text into Mermaid flowchart syntax, then generate a PNG flowchart with top-bottom, left-right, or free layout.
    zh_Hans: 选择LLM模型，将用户输入文本自动总结为Mermaid流程图结构，并按上下结构、左右结构或自由结构生成PNG流程图。
  llm: Use a selected LLM model to summarize text into Mermaid flowchart syntax and render it as a PNG flowchart.
parameters:
  - name: model_config
    type: model-selector
    scope: llm
    required: true
    label:
      en_US: LLM Model
      zh_Hans: LLM模型
    human_description:
      en_US: The LLM model used to summarize the input text into Mermaid flowchart syntax.
      zh_Hans: 用于把输入文本总结成Mermaid流程图结构的LLM模型。
    llm_description: The LLM model used to summarize text into Mermaid flowchart syntax.
    form: form
  - name: text_content
    type: string
    required: true
    label:
      en_US: Text Content
      zh_Hans: 文本内容
    human_description:
      en_US: Plain text content to summarize and convert into a flowchart.
      zh_Hans: 要总结并转换为流程图的普通文本内容。
    llm_description: Plain text content that will be summarized into Mermaid flowchart syntax.
    form: llm
  - name: layout_mode
    type: select
    required: false
    default: left_right
    label:
      en_US: Flowchart Layout
      zh_Hans: 流程图模式
    human_description:
      en_US: Choose the output flowchart layout.
      zh_Hans: 选择输出流程图的布局模式。
    llm_description: Output layout mode for the flowchart.
    form: form
    options:
      - value: top_bottom
        label:
          en_US: Top-Bottom Layout
          zh_Hans: 上下结构
        description:
          en_US: Vertical flowchart layout.
          zh_Hans: 从上到下展开的流程图布局。
      - value: left_right
        label:
          en_US: Left-Right Layout
          zh_Hans: 左右结构
        description:
          en_US: Horizontal flowchart layout.
          zh_Hans: 从左到右展开的流程图布局。
      - value: free
        label:
          en_US: Free Structure
          zh_Hans: 自由结构
        description:
          en_US: Use the optimized free layout renderer.
          zh_Hans: 使用优化后的自由结构流程图渲染器。
  - name: theme
    type: select
    required: false
    default: modern
    label:
      en_US: Visual Theme
      zh_Hans: 视觉主题
    human_description:
      en_US: Choose the visual theme for the flowchart.
      zh_Hans: 选择流程图的视觉主题。
    llm_description: Visual theme selection for the flowchart appearance and color scheme.
    form: form
    options:
      - value: modern
        label:
          en_US: Modern (Default)
          zh_Hans: 现代风格（默认）
      - value: classic
        label:
          en_US: Classic
          zh_Hans: 经典风格
      - value: business
        label:
          en_US: Business
          zh_Hans: 商务风格
      - value: tech
        label:
          en_US: Technology
          zh_Hans: 科技风格
      - value: minimal
        label:
          en_US: Minimal
          zh_Hans: 简约风格
  - name: filename
    type: string
    required: false
    label:
      en_US: Filename
      zh_Hans: 文件名
    human_description:
      en_US: Optional base filename for downloadable Mermaid source.
      zh_Hans: 可选文件名，用于下载AI生成的Mermaid源文件。
    llm_description: Optional base filename for the generated Mermaid source file.
    form: llm
  - name: download_mermaid
    type: boolean
    required: false
    default: false
    label:
      en_US: Download Mermaid File
      zh_Hans: 是否下载Mermaid文件
    human_description:
      en_US: Whether to output the AI-generated Mermaid file in addition to the PNG image.
      zh_Hans: 除了正常输出流程图图片外，是否同时输出AI生成的Mermaid文件。
    form: form
extra:
  python:
    source: tools/ai_flow_map.py
