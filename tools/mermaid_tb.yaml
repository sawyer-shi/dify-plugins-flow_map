identity:
  name: "mermaid_tb"
  author: "sawyer-shi"
  label:
    en_US: "Flowchart ↓ Top-Bottom Layout"
    zh_Hans: "流程图 ↓ 上下布局"
description:
  human:
    en_US: "Enter Mermaid flowchart syntax (graph TD/LR) text information to generate vertical layout visualization flowchart."
    zh_Hans: "输入Mermaid流程图语法（graph TD/LR）文本信息，生成垂直布局可视化流程图。"
  llm: "Generate vertical (top-to-bottom) flowcharts from Mermaid graph syntax. Perfect for decision trees and hierarchical structures."
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Mermaid Syntax
      zh_Hans: Mermaid语法
    human_description:
      en_US: "Enter Mermaid flowchart syntax (graph TD/LR) text information to generate vertical layout visualization flowchart"
      zh_Hans: "输入Mermaid流程图语法（graph TD/LR）文本信息，生成垂直布局可视化流程图"
    llm_description: "Mermaid flowchart syntax that will be rendered in vertical top-to-bottom layout regardless of graph direction"
    form: llm
  - name: theme
    type: select
    required: false
    default: modern
    label:
      en_US: Visual Theme
      zh_Hans: 视觉主题
    human_description:
      en_US: "Choose the visual theme for the flowchart. Different themes provide different color schemes and styling."
      zh_Hans: "选择流程图的视觉主题。不同主题提供不同的配色方案和样式。"
    llm_description: "Visual theme selection for the flowchart appearance and color scheme"
    form: form
    options:
      - value: modern
        label:
          en_US: Modern (Default)
          zh_Hans: 现代风格（默认）
      - value: classic
        label:
          en_US: Classic
          zh_Hans: 经典风格
      - value: business
        label:
          en_US: Business
          zh_Hans: 商务风格
      - value: tech
        label:
          en_US: Technology
          zh_Hans: 科技风格
      - value: minimal
        label:
          en_US: Minimal
          zh_Hans: 简约风格
extra:
  python:
    source: tools/mermaid_tb.py
