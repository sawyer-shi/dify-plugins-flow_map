identity:
  name: "mermaid_free"
  author: "sawyer-shi"
  label:
    en_US: "Flowchart - Free Layout"
    zh_Hans: "流程图 - 自由布局"
    pt_BR: "Fluxograma → Layout Livre"
    ja_JP: "フローチャート → フリーレイアウト"
description:
  human:
    en_US: "Generate free layout flowcharts from any Mermaid syntax."
    zh_Hans: "从任何Mermaid语法生成自由布局流程图。"
    pt_BR: "Gere fluxogramas de layout livre de qualquer sintaxe Mermaid."
    ja_JP: "任意のMermaid構文からフリーレイアウトフローチャートを生成します。"
  llm: "Generate free layout flowcharts from any Mermaid syntax with automatic language detection and optimized layout. Supports flowcharts with classic styling."
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Mermaid Syntax
      zh_Hans: Mermaid语法
      pt_BR: Sintaxe Mermaid
      ja_JP: Mermaid構文
    human_description:
      en_US: "Enter any Mermaid syntax for free layout visualization of flowcharts with automatic language detection"
      zh_Hans: "输入任何Mermaid语法，自动检测语言并生成自由布局的流程图"
      pt_BR: "Insira qualquer sintaxe Mermaid para visualização de layout livre de fluxogramas com detecção automática de idioma"
      ja_JP: "自動言語検出付きでフリーレイアウトのフローチャートを表示する任意のMermaid構文を入力"
    llm_description: "Any Mermaid syntax that will be rendered as flowcharts with optimized free layout based on language detection"
    form: llm
  - name: style
    type: select
    required: false
    label:
      en_US: Chart Style
      zh_Hans: 图表风格
      pt_BR: Estilo do Gráfico
      ja_JP: チャートスタイル
    human_description:
      en_US: "Choose the visual style for the generated chart"
      zh_Hans: "选择生成图表的视觉风格"
      pt_BR: "Escolha o estilo visual para o gráfico gerado"
      ja_JP: "生成されたチャートのビジュアルスタイルを選択"
    llm_description: "Visual style option for the chart rendering"
    form: form
    default: "classic"
    options:
      - value: "classic"
        label:
          en_US: Classic
          zh_Hans: 经典风格
          pt_BR: Clássico
          ja_JP: クラシック
      - value: "hand_drawn"
        label:
          en_US: Hand Drawn
          zh_Hans: 手绘风格
          pt_BR: Desenho à Mão
          ja_JP: 手描き
extra:
  python:
    source: tools/mermaid_free.py